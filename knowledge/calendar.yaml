# 出海宣发日历（2026-11 ~ 2027-10）—— Clear Run 档期引擎的输入
# kind:
#   holiday     法定假日/长假：受众离线或注意力被家庭活动占据
#   rival       抢注意力的大事件：科技发布会、大型购物节、体育赛事
#   sensitive   敏感日/敏感期：会轻度占用注意力，主要作用是"主题拦截"（见 blocks）
#   opportunity 顺势窗口：受众匹配时加分
# attention: 0-1，事件占用公众注意力的程度（之后可用该语言版维基 pageviews 校准，ClearRun 有现成代码）
# audience:  对不同受众分群的影响 0-1（developer / prosumer / consumer / enterprise / student；all 是其余分群的默认值）
# blocks:    素材里出现这些信号（src/shared/signals.ts）时，覆盖到这个事件的发布周会被拦截
# rules:     关联 rules.yaml，解释为什么拦截
# confidence:
#   confirmed  法定假日（Nager.Date API，2026-11-11 拉取）或已核实的固定日期
#   rule       按固定规则推算（如"11 月第三个星期四"）
#   estimated  按往年惯例估计，官方尚未公布，UI 上标"预计"

